<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סיפורו של איתמר</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Unique styles for the Story Page */
        .story-hero { 
            background: var(--primary-red); 
            color: white; 
            padding: 4rem 0; 
            text-align: center; 
        }
        
        .story-hero h1 {
            color: white;
            font-size: 2.5rem;
            margin-top: 1rem;
        }

        .paper { 
            max-width: 800px; 
            margin: -50px auto 50px; 
            background: white; 
            padding: 3rem; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
            position: relative; 
            z-index: 10;
        }

        .back-link { 
            display: inline-block; 
            color: rgba(255,255,255,0.9); 
            margin-bottom: 1rem; 
            border: 1px solid rgba(255,255,255,0.3); 
            padding: 0.5rem 1.2rem; 
            border-radius: 50px; 
            font-weight: 500;
        }
        .back-link:hover { 
            background: white; 
            color: var(--primary-red); 
        }

        /* --- UPDATED IMAGE STYLE (No Cropping) --- */
        .story-featured-image {
            width: 100%; /* Take full width of the paper */
            height: auto; /* Adjust height automatically based on the image ratio */
            max-height: 650px; /* Cap the height so portrait photos don't take up the whole screen */
            object-fit: contain; /* Ensure the WHOLE image fits inside */
            border-radius: 16px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        /* The text content */
        #content {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #333;
            white-space: pre-line; /* This preserves your paragraphs! */
        }
        
        @media (max-width: 768px) {
            .paper { margin-top: -30px; padding: 1.5rem; width: 95%; }
            .story-hero h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo">זוכרים את איתמר</div>
            <a href="index.html" style="font-weight: 700;">חזרה לדף הבית</a>
        </div>
    </nav>

    <div class="story-hero">
        <div class="container">
            <a href="index.html" class="back-link">&larr; חזרה לכל הסיפורים</a>
            <h1 id="title">טוען סיפור...</h1>
        </div>
    </div>

    <div class="container">
        <div class="paper">
            <img id="storyImage" class="story-featured-image" src="" alt="">
            
            <p id="content"></p>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>נבנה באהבה לזכרו של יוסף איתמר ברוכים הי״ד. ת.נ.צ.ב.ה</p>
        </div>
    </footer>

    <script>
        // Get the ID from the URL (e.g., story.html?id=father)
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        // Data for the stories
        const stories = {
            'mother': { 
                title: 'אורלי אמא של איתמר מספרת על חוש צדק מגיל ילדות', 
                image: 'images/story-mom-orly.jpg',
                text: `כשאיתמר היה ילד בגן, היתה בגן מסיבה וכל ילד היה תפקיד. כל ההורים הגיעו אל המסיבה, בה ילדיי הגן היו אמורים להעלות הצגה. כשהגיע התור של איתמר לקום ולהשתתף בהצגה, הוא בחר שלא לקום ושלא לקחת חלק במסיבה ורק נצמד אל אמא שלו שישבה לידו. וכך נהגו גם מספר ילדים נוספים שסירבו להשתתף באותה הצגה, לא קמו והמשיכו לשבת ליד הוריהם. לאחר המסיבה, אורלי שאלה את איתמר מה קרה ומדוע הוא בחר לא להשתתף ואיתמר אמר לה שזה בגלל שהגננת צעקה עליו ועל ילדים נוספים והתנהגה אליהם לא יפה ולכן אותם ילדים החליטו לא להשתתף בהצגה.

הסיפור הזה מתקשר לעוד אירוע שהיה לאחר מספר שנים עת איתמר היה תלמיד בבית ספר תיכון, שם לימדה מורה שהתנהגה בצורה שאינה מקובלת ואינה מכבדת וכללה צעקות והשפלות כלפיי התלמידים בכיתה של איתמר. איתמר סיפר לנו על אותה מורה ואמר שהוא ממש לא יכול שהיא תמשיך ללמד אותו ותהיה חלק מצוות המורים כי היא פוגעת בתלמידים. לכן, איתמר פעל על מנת שאותה המורה תושהה מבית הספר והנהלת בית הספר בחנה את הטענות ובסופו של יום סילקה את אותה מורה. (הערה - איתמר הקליט את אותה מורה כשהיא צועקת והציג להנהלה את אותן "ראיות" אחרת יש להניח שההנהלה לא היתה מתייחסת לדברים בחומרה הנדרשת).

אני מוסיף - שאיתמר היה ילד רגיש לסובבים אותו, פעיל (ואף מדריך) בתנועת נוער (כמובן שלאחר מכן מפקד בצנחנים) ותמיד רדף צדק ופעל למנוע עוולות.` 
            },

            'brother': { 
                title: 'האח נדב מספר איך איתמר דאג שיתאמן ויאמץ אורח חיים בריא', 
                image: 'images/story-brother-nadav.avif',
                text: `תחום הכושר הגופני והבריאות תמיד היה מאוד חשובים לאיתמר.

כשהייתי בן 9, איתמר שם לב שאני לא ממש מפעיל את הגוף, רוב הזמן שיחקתי במחשב והייתי בחדרי. איתמר, שידע שזה לא בריא, ורצה את הטוב ביותר עבורי, החליט לקחת את המצב לידיים שלו. כהתחלה, בכל יום רביעי הוא היה קורא לי אל חדר העבודה של אימי שנמצא אצלנו בבית ובעזרת מתקני אימון שהוא התקין שם, העביר לי אימון גופני. גם כשלא רציתי, גם כשהיה לי קשה, הוא לא ויתר עליי אפילו לרגע כי הוא ידע כמה חשוב הכושר הגופני, וכמה הוא תורם לבריאות.

בזכותו, התחלתי להשתפר לאט לאט ואפילו ממש לאהוב כושר ובריאות. בשנתיים האחרונות, כמעט בכל פעם שהגיע הביתה מהצבא לחופשת שישי-שבת היינו הולכים יחד למכון הכושר לאימון משותף. הזיכרון שלו מתחיל לאמן אותי ומאמין שזה הדבר הנכון עבורי ולא מוותר עליי - גם כשאני ממש לא בכושר - מרגש אותי מאוד, ואני אמשיך לחיות את עולם הכושר והבריאות גם בשבילו.` 
            },

            'father': { 
                title: 'אבא של איתמר מספר על ראיית הטוב בכל מצב', 
                image: 'images/story-dad-meir.avif',
                text: `איתמר התנדב לצנחנים אחרי מיונים ארוכים.

מייד אחרי הגיוס ולאחר שהוא כבר התקבל לצנחנים, נערכו מיונים נוספים והפעם לסיירות.
איתמרי התאמץ מאוד, הגיע להשגים טובים חזר הביתה פצוע בזרועות עייף בטרוף והיתה לו תחושה טובה שהוא אכן יתקבל לסיירת. אבל כמה ימים אחר כך נאמר לו שלא עבר את המיונים והוא שוייך לגדוד 101 בצנחנים שנחשב לגדוד הטוב ביותר של צנחנים.

איתמר התאכזב מאוד מכך שלא התקבל לסיירת והיו לנו שיחות בהן הוא לא הבין למה לא נבחר. יחד עם זאת, יומיים לאחר מכן הוא הודיע למשפחה המשפחה ולחברים: ״החלטתי שאין לי מה להמשיך לחשוב על זה שלא התקבלתי לסיירת ושאני הולך להתמקד בלהיות החייל הכי טוב בגדוד 101" וכך היה.

הוא היה עם כוחות ואמונה בעצמו והשקיע רבות בשירות ובסלול שהוא עשה. איתמר סיום את המסלול, היה בשכם עבר אימון חורף בשלג בגבול לבנון והצטיין באימון ובשלב מאוחר יותר בחרו בו לצאת לקורס מכ״ים - אליו מתקבלים הטובים ביותר ומי שמיועדים על ידי הצבא למסלול של קצונה. עם סיום קורס המפקדים הוא קיבל כיתת טירונים ובהמשך הפך לסמל מחלקה ואז לרב סמל פלוגתי. אהב כל רגע בשירות הצבאי וחש מחויבות עמוקה כלפיי חייליו.` 
            },

            'sister': { 
                title: 'האחות ענבל מספרת על הגישה של איתמר', 
                image: 'images/story-sister-inbal.jpg',
                text: `כשאיתמר היה בהכשרה בצנחנים, הוא הכיר אנשים מכל רחבי הארץ, מכל הדעות, ומכל הזרמים.

אחד החיילים שהיה עם איתמר, היה חייל דתי בעל אמונה גדולה, שעל כל דבר – וגם בזמנים הקשים וגם שהמפקדים הטילו עונשים – היה אומר "איזו זכות". כשניקו שירותים, החייל אמר ״איזו זכות לנקות את השירותים בבסיס של צבא ההגנה לישראל!״. כשרצו סביב המבנה כעונש היה אומר ״איזו זכות לבנות את הכושר כחיילי צה״ל כדי להגן על המדינה!״.

תחילה איתמר (כמו גם יתר החיילים במחלקה) היה מופתע ממנו אך לאט לאט למד כי זו הגישה הנכונה והחל לאמץ את אותה אמירה בעצמו. איתמר לא עצר עם אותו משפט רק בצבא והוא החליט שהוא מאמץ ומיישם את הגישה הזו ואת המנהג גם לתחומים נוספים.

איתמר סיפר לנו את הסיפור הזה כמה וכמה פעמים, כדי להנחיל את המנהג הזה גם אצלנו. הוא הקפיד להזכיר לנו את זה ולהתנהג כך גם בבית וכך הביטוי "איזו זכות" הפך לסוג של מטבע לשון אצל איתמר. כשההורים היו מבקשים מאיתנו לסדר את כל הבית, סידור ״כבד״ כזה, איתמר אמר לי ולנדב ״איזו זכות! לסדר את הבית כמו שאמא ואבא ביקשו״ או ״איזו זכות לשטוף את הגינה בבית בארץ ישראל״, וכמובן שתמיד אמר "איזו זכות לשרת את עם ישראל". ואני בזכותו אימצתי את המנהג. אני חייבת לו המון תודה על היכולת להגיד "איזו זכות" ברגעים קשים או מעצבנים, ולהצליח לעשות את הדברים בשמחה במקום בבאסה.` 
            },

            'partner': { 
                title: 'ליאור בת הזוג מספרת על בן הזוג האוהב והמסור', 
                image: 'images/story-girlfriend-lior.avif',
                text: `איתמר ילד מיוחד, עם לב גדול, עם מוכנות גדולה להשקיע ולתת מעצמו לסובבים אותו. אחרי כמעט שנה של זוגיות איתו, היה לי מסע כומתה בסוף הטירונות ואיתמר היה בקורס מכים. לא ידעתי אם יצליח לבוא למסע לראות אותי מסיימת הכשרה.

בסוף המסע אני רואה אותו עומד שם עם המשפחה שלי. בדיעבד גיליתי שהוא בעצמו עשה מסע כומתה בשביל להגיע לרגע הזה. אחרי לילה לבן של תרגולים מעייפים ומאמצים בשטח, הוא יצא בשלוש לפנות בוקר לתחנת אוטובוס שהיה במרחק שעה הליכה והחליף כמה אוטובוסים רק כדי שאוכל לראות אותו שם בסוף המסע.
בסוף יצא ששנינו עשינו מסעות באותו יום בשביל להגיע להיות באותו מקום ביחד.` 
            },

            'grandfather': { 
                title: 'סבא גדליהו מספר על העזרה של איתמר בשימור הכושר הגופני', 
                image: 'images/story-granpda-gdalyahu.avif',
                text: `איתמר היה נכד טוב, כיבד את סבא וסבתא שלו ודאג להם. סבא גדליהו תמיד היה סבא חזק ודאג לנו מאוד, בעבר הוא נהג לקחת אותנו מבית הספר והגן והסיע אותנו לאן שרצינו ואיתמר מאוד העריך אותו ובכל הזדמנות עזר לו בחזרה.

כשאיתמר התגייס, הוא שם לב שהכושר של סבא גדליהו מעט מדרדר. איתמר, שמאוד אהב כושר והיה מומחה בתחום, החליט לקחת את העניין לידיים שלו. בכל פעם שיצא מהצבא, הוא היה לוקח את סבו לאימון מותאם עבורו, הם יצאו יחד להליכה בטיילת ואיתמר הדריך אותו בתרגילי כושר על מנת שיתחזק. למרות שהזמן של איתמר בבית היה מועט, הוא הקפיד על האימונים עם סבו ולא פספס אותם.

האימונים האלו חיזקו את סבו, ויותר מכך גרמו לו לדעת שאיתמר אוהב אותו ומעריך אותו מאוד.
סבו גדליהו מספר: "כמה מילים לזכרו של איתמרוש האהוב שלנו שבכל הזדמנות שאיתמרוש היה מגיע הביתה היה לוקח אותי לטיילת ליד החוף ועושה לי תרגילי ספורט בטיילת שמאוד אהבתי. איתמרוש היה נכד אהוב מאוד על כולם ואני גם אהבתי מאוד את איתמרי וידוע לי שגם איתמרוש אהב אותי מאוד".` 
            }
        };

        // Logic to populate the page
        if (stories[id]) {
            document.getElementById('title').innerText = stories[id].title;
            document.getElementById('content').innerText = stories[id].text;
            
            // Set image source
            const imgElement = document.getElementById('storyImage');
            imgElement.src = stories[id].image;

        } else {
            document.getElementById('title').innerText = 'סיפור לא נמצא';
            document.getElementById('content').innerText = 'אנא חזרו לדף הבית ובחרו סיפור מהרשימה.';
            document.getElementById('storyImage').style.display = 'none';
        }
    </script>
</body>
</html>
