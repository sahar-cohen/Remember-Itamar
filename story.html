<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סיפורו של איתמר</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>document.documentElement.className = 'js'; setTimeout(function () { if (!window.siteReady) document.documentElement.classList.remove('js'); }, 2500);</script>
</head>
<body>

    <nav class="nav is-solid" id="nav">
        <div class="container nav-inner">
            <a href="index.html" class="brand">זוכרים את איתמר</a>
            <button class="menu-btn" id="menu-btn" aria-label="תפריט" aria-expanded="false"><span></span><span></span></button>
            <div class="nav-links" id="nav-links">
                <a href="index.html#about">על איתמר</a>
                <a href="index.html#stories">סיפורים</a>
                <a href="index.html#song">השיר</a>
                <a href="index.html#contact">שתפו אותנו</a>
            </div>
        </div>
    </nav>

    <main class="story-page">
        <div class="container">
            <a href="index.html#stories" class="back-link"><i>&rarr;</i> חזרה לכל הסיפורים</a>
            <h1 id="title" class="reveal">טוען סיפור...</h1>
            <div class="story-layout">
                <div class="story-body reveal" id="content" style="--delay: 0.1s"></div>
                <figure class="story-photo reveal-img"><img id="storyImage" src="" alt=""></figure>
            </div>

            <section class="more-stories">
                <h2 class="section-title">סיפורים נוספים</h2>
                <div class="more-grid" id="more"></div>
            </section>
        </div>
    </main>

    <div class="floating-links" id="floating-links">
        <a class="float-btn float-instagram" href="https://www.instagram.com/rememberitamar/" target="_blank" rel="noopener" aria-label="עמוד האינסטגרם לזכרו של איתמר">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="12" cy="12" r="4.3" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="17.4" cy="6.6" r="1.2" fill="currentColor"/></svg>
        </a>
        <a class="float-btn float-whatsapp" aria-label="לקבוצת העדכונים בווטסאפ" href="https://chat.whatsapp.com/GygtuAQmglH5ugLsgziRcv?mode=gi_t" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
            <span>לקבוצת העדכונים</span>
        </a>
    </div>

    <footer>
        <div class="container">
            <p>נבנה באהבה לזכרו של יוסף איתמר ברוכים הי״ד. ת.נ.צ.ב.ה</p>
        </div>
    </footer>

    <script src="stories.js"></script>
    <script>
        (function () {
        const id = new URLSearchParams(window.location.search).get('id');
        const item = storyList.find(function (entry) { return entry.id === id; });
        const content = document.getElementById('content');
        const img = document.getElementById('storyImage');

        if (item && stories[id]) {
            const story = stories[id];
            document.getElementById('title').textContent = story.title;
            document.title = story.title;
            img.src = story.image;
            img.alt = item.author + ' ואיתמר';
            if (item.imagePosition) img.style.objectPosition = item.imagePosition;
            story.text.split(/\n\s*\n/).forEach(function (paragraph) {
                const p = document.createElement('p');
                p.textContent = paragraph.trim();
                content.appendChild(p);
            });
        } else {
            document.getElementById('title').textContent = 'סיפור לא נמצא';
            content.textContent = 'אנא חזרו לדף הבית ובחרו סיפור מהרשימה.';
            img.parentElement.style.display = 'none';
        }

        const more = document.getElementById('more');
        // Show the next 5 stories in site order, wrapping around to the start
        const start = Math.max(storyList.indexOf(item), 0);
        const nextStories = storyList.slice(start + 1).concat(storyList.slice(0, start))
            .filter(function (entry) { return entry.id !== id; })
            .slice(0, 5);
        nextStories.forEach(function (entry) {
            const card = document.createElement('a');
            card.className = 'mini-card';
            card.href = 'story.html?id=' + entry.id;
            card.innerHTML = '<figure><img loading="lazy" alt=""></figure><h3></h3>';
            const cardImg = card.querySelector('img');
            cardImg.src = stories[entry.id].image;
            if (entry.imagePosition) cardImg.style.objectPosition = entry.imagePosition;
            card.querySelector('h3').textContent = stories[entry.id].title;
            more.appendChild(card);
        });
        })();
    </script>
    <script src="site.js"></script>
</body>
</html>
